adzuna:
  # each term can restrict countries; default = all listed countries
  countries: [gb, fr, de, nl, it, es, us, ca, ch, sg]
  terms:
    - {q: software placement, countries: [gb]}
    - {q: industrial placement software, countries: [gb]}
    - {q: software engineering internship 2027}
    - {q: machine learning internship}
    - {q: "stage ingénieur logiciel", countries: [fr]}
  results_per_page: 50
  max_pages: 2          # trial-tier request limits: keep queries targeted

reed:
  keywords:
    - software industrial placement
    - software placement year
    - machine learning internship
    - software engineering intern 2027
  max_results_per_term: 100

# Employer career sites that only exist once JavaScript has run. Dyson is the
# reason: its listings are absent from the HTML, the sitemap and any reachable
# API, and its graduate roles only appear behind ?q=graduate. Each entry costs
# one browser page-load per query, so keep the list short and the queries sharp.
# Needs `playwright install chromium`; without it the fetcher logs and skips.
headless_careers:
  enabled: true
  sites:
    - company: Dyson
      url: https://careers.dyson.com/en-gb/search-results/
      # Checked 2026-08-17: Dyson had no software internship listed — their only
      # intern role was retail marketing, and their graduate engineering roles
      # are the wrong TYPE for Aug. Kept anyway because their placement cycle
      # opens in the autumn and this is the only way those roles are visible.
      queries: [intern, placement]
      wait_ms: 7000

jobspy:
  enabled: true
  # linkedin/glassdoor often blocked from CI IPs; indeed+google are reliable.
  sites: [indeed, google]
  terms:
    - software engineer intern
    - machine learning intern
    - 12 month placement software
    - audio software intern
    - motorsport software placement
    - data engineering intern
  locations:
    - {location: "London, UK", country_indeed: UK}
    - {location: "United Kingdom", country_indeed: UK}
    - {location: "Paris, France", country_indeed: France}
    - {location: "Remote", country_indeed: UK}
    - {location: "Canada", country_indeed: Canada}
    - {location: "Switzerland", country_indeed: Switzerland}
    - {location: "Singapore", country_indeed: Singapore}
  results_wanted: 20
  hours_old: 220        # ~9 days: covers a weekly run with slack
  proxies: []           # optional list of "user:pass@host:port"

hiringcafe:
  # interest-area queries; commitment filtered to Internship in the fetcher
  queries:
    - software engineer intern
    - machine learning intern
    - data engineer intern
    - audio software intern
    - motorsport software
  max_per_query: 40

trackr:
  enabled: true

aidevjobs:
  enabled: true

placement_boards:
  ratemyplacement: true
  gradcracker: true
  welcometothejungle: true
  hyrd: true

