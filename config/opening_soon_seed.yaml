# Programmes that predictably open but aren't live yet (spec sec 6). Seeds the
# Opening Soon tab on first run; deduped against existing rows so re-runs don't
# duplicate.
#
# WHAT expected_open MEANS: the date the pipeline should START LOOKING for the
# real posting. It is not a claim about when applications open. Most of these
# are guesses at a likely month written as the 1st of it, so the dashboard shows
# them as "Expected September", never as "Opens in 13 days", and a row only
# becomes "OPEN NOW" when a matching posting is actually found (see
# opening_soon_evidence.py).
#
# status: use "Announced" ONLY when the employer has published an actual date —
# that is the one case the dashboard shows a countdown to a specific day.
# Everything else stays "Predicted from last year" and is displayed as a month.
# Put the basis for a prediction in notes so the next person knows what it rests
# on rather than having to trust a bare date.
#
# status: Announced | Predicted from last year
# Target window: 2027 summer internships + 2027-28 year-in-industry placements.

entries:
